<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Escáner WMS - WALCAS</title>
<style>
  :root{--bg:#0d0f12;--surface:#151820;--border:#232733;--accent:#00e5ff;--ok:#22c55e;--danger:#ef4444;--text:#e8eaf0;--muted:#6b7280;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px;}
  h2{font-size:15px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);margin-bottom:16px;text-align:center;}
  #reader{width:100%;max-width:400px;border-radius:12px;overflow:hidden;border:1px solid var(--accent);}
  #hint{margin-top:16px;font-size:14px;color:var(--muted);text-align:center;}

  /* ── Paso previo: captura de N° de Factura / O.C. ── */
  #doc-step{width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px;}
  #doc-step.oculto{display:none;}
  #reader-wrap.oculto{display:none;}
  .doc-label{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
  #doc-input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;color:var(--text);font-size:16px;font-weight:700;letter-spacing:.03em;outline:none;text-transform:uppercase;}
  #doc-input:focus{border-color:var(--accent);}
  #doc-continuar{width:100%;background:rgba(0,229,255,.12);border:1px solid var(--accent);border-radius:10px;padding:15px;color:var(--accent);font-size:15px;font-weight:700;letter-spacing:.05em;cursor:pointer;min-height:52px;}
  #doc-continuar:active{opacity:.7;}
  #doc-error{color:var(--danger);font-size:13px;text-align:center;min-height:16px;}
  #doc-nota{font-size:12px;color:var(--muted);text-align:center;line-height:1.5;}
</style>
</head>
<body>
<h2>Escáner WMS · WALCAS</h2>

<div id="doc-step">
  <div class="doc-label">N° de Factura / O.C.</div>
  <input id="doc-input" type="text" placeholder="Ej: FAC-00231 o OC-4587" autocomplete="off" autofocus/>
  <div id="doc-error"></div>
  <button id="doc-continuar" onclick="continuarConFactura()">▶ Continuar y Escanear</button>
  <div id="doc-nota">Ingresá el número mirando el documento antes de empezar a escanear.</div>
</div>

<div id="reader-wrap" class="oculto">
  <div id="reader"></div>
  <div id="hint">Apuntá la cámara al código...</div>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
  const URL_WMS = "https://script.google.com/macros/s/AKfycbyMCGz-6m2g7s8XevSQdpiNzPU7qo39UBRlca_y6kHrvO1TIxDm6zuudnrpu-M_8uS5/exec";
  let documentoActual = "";
  let html5QrCode = null;

  // Si venimos de un producto anterior dentro del MISMO pedido, el número de
  // documento ya viene en la URL (?documento=...) y no se vuelve a pedir:
  // se salta directo a la cámara para escanear el siguiente producto.
  (function(){
    const params  = new URLSearchParams(window.location.search);
    const docParam = params.get('documento');
    if(docParam){
      documentoActual = docParam;
      iniciarCamara();
    }
  })();

  function continuarConFactura(){
    const valor = document.getElementById('doc-input').value.trim().toUpperCase();
    if(!valor){
      document.getElementById('doc-error').textContent = 'Ingresá el número de factura u orden antes de continuar.';
      return;
    }
    documentoActual = valor;
    iniciarCamara();
  }

  function iniciarCamara(){
    document.getElementById('doc-step').classList.add('oculto');
    document.getElementById('reader-wrap').classList.remove('oculto');
    html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 240 },
      (decodedText) => {
        document.getElementById('hint').textContent = 'Código detectado, buscando...';
        html5QrCode.stop().catch(()=>{});
        procesarCodigo(decodedText);
      },
      () => {}
    ).catch(() => {
      document.getElementById('hint').textContent = 'No se pudo acceder a la cámara. Revisá los permisos.';
    });
  }

  // Anexa el número de documento (si existe) a la URL de destino, respetando
  // si esa URL ya trae otros parámetros (?) o todavía no tiene ninguno.
  function conDocumento(url){
    if(!documentoActual) return url;
    const separador = url.indexOf('?') === -1 ? '?' : '&';
    return url + separador + 'documento=' + encodeURIComponent(documentoActual);
  }

  function procesarCodigo(texto){
    if(texto.indexOf(URL_WMS) === 0){
      window.location.href = conDocumento(texto);
      return;
    }
    fetch(URL_WMS + '?action=buscarPorCodigo&codigo=' + encodeURIComponent(texto))
      .then(r => r.json())
      .then(data => {
       if(data.ok){
          const destino = URL_WMS + '?id=' + encodeURIComponent(data.id) + '&tipo=' + encodeURIComponent(data.tipo || '');
          window.location.href = conDocumento(destino);
        } else {
          document.getElementById('hint').textContent = 'Código no reconocido: ' + texto;
        }
      })
      .catch(() => {
        document.getElementById('hint').textContent = 'Error de conexión al buscar el código.';
      });
  }
</script>
</body>
</html>
